# Profile for MySQL demo environment (activate with --spring.profiles.active=demo)
spring:
  datasource:
    url: jdbc:mysql://insighthub-demo-mysql:3306/insighthub
    username: insighthub
    password: ${MYSQL_PASSWORD:insighthub}
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/mysql,classpath:db/demo
    baseline-on-migrate: true
