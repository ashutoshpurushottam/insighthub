apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: insighthub
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: insighthub
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
