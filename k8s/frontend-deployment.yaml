apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: insighthub
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: insighthub/frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              value: "backend-service:8080"
          resources:
            requests:
              cpu: "64m"
              memory: "64Mi"
            limits:
              cpu: "256m"
              memory: "128Mi"
