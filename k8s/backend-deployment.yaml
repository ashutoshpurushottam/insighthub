apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: insighthub
  labels:
    app: insighthub
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insighthub
      component: backend
  template:
    metadata:
      labels:
        app: insighthub
        component: backend
    spec:
      containers:
        - name: backend
          image: insighthub/backend:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: insighthub-config
            - secretRef:
                name: insighthub-secret
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /insighthub/actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /insighthub/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
